<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f4ec"/>
  <rect x="0" y="680" width="1600" height="220" fill="#efe6cf"/>
  <path d="M0 680 Q 400 655 800 680 T 1600 680" fill="none" stroke="#d8c9a0" stroke-width="3"/>

  <g stroke="#3a4a5c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- fuselage -->
    <path d="M480 560 L 1180 560 L 1240 580 L 1180 600 L 480 600 Z" fill="#efe8d6"/>
    <!-- nose engine block -->
    <rect x="420" y="555" width="70" height="50" fill="#8c7a56" stroke="none"/>
    <!-- propeller -->
    <line x1="415" y1="500" x2="415" y2="660"/>
    <!-- upper wing -->
    <rect x="560" y="440" width="520" height="34" fill="#efe8d6"/>
    <!-- lower wing -->
    <rect x="560" y="600" width="520" height="34" fill="#e7ddc4"/>
    <!-- struts + bracing wires -->
    <line x1="620" y1="474" x2="620" y2="600"/>
    <line x1="1000" y1="474" x2="1000" y2="600"/>
    <line x1="620" y1="600" x2="1000" y2="474" stroke-width="2"/>
    <line x1="620" y1="474" x2="1000" y2="600" stroke-width="2"/>
    <!-- tail -->
    <path d="M1180 560 L 1290 500 L 1300 515 L 1220 570 Z" fill="#e7ddc4"/>
    <rect x="1150" y="590" width="90" height="16" fill="#e7ddc4"/>
    <!-- cockpits -->
    <circle cx="760" cy="575" r="18" fill="none"/>
    <circle cx="880" cy="575" r="18" fill="none"/>
    <!-- landing gear -->
    <line x1="640" y1="605" x2="640" y2="660"/>
    <line x1="760" y1="605" x2="760" y2="660"/>
    <circle cx="700" cy="668" r="30" fill="#efe8d6"/>
    <!-- tailskid -->
    <line x1="1230" y1="585" x2="1250" y2="640"/>
  </g>
</svg>
