<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f4ec"/>
  <!-- pale starfield, kept light for print -->
  <g fill="#c9b98a">
    <circle cx="180" cy="160" r="4"/>
    <circle cx="1420" cy="130" r="4"/>
    <circle cx="1300" cy="700" r="4"/>
    <circle cx="240" cy="640" r="4"/>
    <circle cx="90" cy="400" r="3"/>
    <circle cx="1500" cy="420" r="3"/>
    <circle cx="700" cy="120" r="3"/>
    <circle cx="1100" cy="760" r="3"/>
  </g>
  <!-- earth limb -->
  <path d="M-100 900 Q 400 650 900 900 Z" fill="#e3edf3" stroke="#31465f" stroke-width="4"/>

  <g stroke="#31465f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- service module -->
    <rect x="880" y="380" width="180" height="200" fill="#e7ddc4"/>
    <path d="M1060 400 L 1120 420 L 1120 540 L 1060 560 Z" fill="#efe6cf"/>
    <!-- engine nozzle -->
    <path d="M1120 460 L 1180 480 L 1180 500 L 1120 500 Z" fill="#dccf9e"/>
    <!-- command module: truncated cone -->
    <path d="M880 380 L 700 420 L 700 540 L 880 580 Z" fill="#efe8d6"/>
    <path d="M700 420 L 640 460 L 640 500 L 700 540 Z" fill="#e7ddc4"/>
    <!-- docking probe -->
    <line x1="640" y1="480" x2="580" y2="480"/>
    <circle cx="570" cy="480" r="10" fill="#c9a24b" stroke="none"/>
    <!-- windows -->
    <circle cx="760" cy="450" r="10"/>
    <circle cx="760" cy="510" r="10"/>
  </g>
</svg>
