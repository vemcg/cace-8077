<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f4ec"/>
  <path d="M0 720 Q 500 690 900 715 T 1600 700 L 1600 900 L 0 900 Z" fill="#e3edf3"/>

  <g stroke="#2c4356" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- sonic ring to suggest supersonic flight -->
    <circle cx="1310" cy="520" r="40" opacity="0.55"/>
    <!-- contrail -->
    <path d="M40 555 L 300 522" stroke="#c7d6e2" stroke-width="10" opacity="0.7"/>
    <!-- slender fuselage, pointed nose -->
    <path d="M300 522 L 240 520 L 300 528 C 520 540 950 536 1180 520 C 1240 516 1280 514 1310 520 C 1280 526 1240 524 1180 528 C 950 544 520 548 300 528 Z" fill="#d7e3ec"/>
    <!-- canopy -->
    <path d="M520 505 Q 585 478 650 505 L 632 518 Q 580 500 538 518 Z" fill="#c7d6e2"/>
    <!-- low-mounted swept wings -->
    <path d="M600 546 L 430 660 L 505 668 L 700 562 Z" fill="#d7e3ec"/>
    <path d="M880 546 L 1060 655 L 985 664 L 800 562 Z" fill="#d7e3ec"/>
    <!-- tail -->
    <path d="M1140 512 L 1250 448 L 1260 464 L 1165 524 Z" fill="#d7e3ec"/>
    <!-- afterburner exhaust -->
    <ellipse cx="1300" cy="522" rx="14" ry="12" fill="#c7d6e2"/>
  </g>
</svg>
